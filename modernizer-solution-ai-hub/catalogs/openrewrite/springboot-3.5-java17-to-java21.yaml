id: springboot-3.5-java17-to-java21
kind: openrewrite-catalog
verification_status: validation-preview-only
plugin:
  group_id: org.openrewrite.maven
  artifact_id: rewrite-maven-plugin
  version: "6.40.0"
recipe_artifacts:
  - group_id: org.openrewrite.recipe
    artifact_id: rewrite-migrate-java
    version: "3.35.0"
active_recipes:
  - org.openrewrite.java.migrate.UpgradeToJava21
preview_goals:
  - dryRun
  - dryRunNoFork
forbidden_apply_goals:
  - run
  - runNoFork
  - rewrite:run
  - rewrite:runNoFork
defaults:
  export_datatables: true
  fail_on_dry_run_results: false
dry_run_only: true
rewrite_run_allowed: false
code_modification_allowed: false
notes:
  - Java 21 is optional runtime validation for Boot 3.5, not a prerequisite for Boot 3.5.
  - Do not target Spring Boot 4 from this profile.

