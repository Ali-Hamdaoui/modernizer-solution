id: springboot-4-java21-sandbox
kind: openrewrite-catalog
verification_status: sandbox
verified_on: "2026-05-21"
verification_sources:
  - https://docs.openrewrite.org/recipes/java/migrate/upgradetojava21
  - https://docs.openrewrite.org/recipes/java/spring/boot4/upgradespringboot_4_0
plugin:
  group_id: org.openrewrite.maven
  artifact_id: rewrite-maven-plugin
  version: "RELEASE"
recipe_artifacts:
  - group_id: org.openrewrite.recipe
    artifact_id: rewrite-migrate-java
    version: "RELEASE"
  - group_id: org.openrewrite.recipe
    artifact_id: rewrite-spring
    version: "RELEASE"
active_recipes:
  - org.openrewrite.java.migrate.UpgradeToJava21
  - org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0
preview_goals:
  - dryRun
  - dryRunNoFork
  - discover
forbidden_apply_goals:
  - run
  - runNoFork
  - rewrite:run
  - rewrite:runNoFork
defaults:
  export_datatables: true
  fail_on_dry_run_results: false
analysis_preview_maven_args:
  - -Denforcer.skip=true
apply_goal: runNoFork
apply_maven_args:
  - -Denforcer.skip=true
