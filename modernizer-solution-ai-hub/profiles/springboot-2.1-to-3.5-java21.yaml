id: springboot-2.1-to-3.5-java21
schema: schemas/migration-profile.schema.json
description: Governed migration route for Spring Boot 2.1.x on Java 8 or 11 to Spring Boot 3.5.14 on Java 21.
strategy: direct_sandbox
risk_level: high
production_allowed: false
fallback_profile: springboot-2.1-to-3.5-java17
source_jdk_home_env: JAVA_HOME_11
target_jdk_home_env: JAVA_HOME_21
tooling_versions:
  lombok: "1.18.34"
  jacoco: "0.8.12"
  maven_compiler_plugin: "3.14.1"
framework_versions:
  jackson: "2.21.2"
  jackson_annotations: "2.21"
  jjwt: "0.13.0"
  thymeleaf: "3.1.3.RELEASE"
  jakarta_validation_api: "3.0.2"
  slf4j_api: "2.0.17"
  spring_security: "6.5.10"
  problem_spring_web: "0.29.1"
  azure_messaging_servicebus: "7.17.16"
source:
  java:
    allowed_versions:
      - "8"
      - "11"
  spring_boot:
    allowed_version_prefixes:
      - "2.1"
  build:
    allowed_tools:
      - maven
target:
  java: "21"
  spring_boot: "3.5.14"
  spring_framework: "6.2.18"
  build: maven
routes:
  - id: boot-2.1-to-3.5-java21
    strategy: multi_hop
    risk_level: high
    production_allowed: false
    preferred: true
    recommended_intermediate:
      spring_boot: "2.7.18"
    migration_units:
      order:
        - baseline
        - spring-boot-2-7-stabilization
        - java-21
        - spring-boot-3-5-14
        - jakarta
        - jaxb-jakarta
        - dependency-cleanup
        - contract-compatibility-review
        - existing-test-migration
      openrewrite:
        spring-boot-2-7-stabilization:
          active_recipes:
            - org.openrewrite.java.spring.boot2.UpgradeSpringBoot_2_7
        java-21:
          active_recipes:
            - org.openrewrite.java.migrate.UpgradeToJava21
        spring-boot-3-5-14:
          active_recipes:
            - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
        jakarta:
          active_recipes:
            - org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta
        jaxb-jakarta:
          active_recipes:
            - org.openrewrite.java.migrate.jakarta.JavaxXmlBindMigrationToJakartaXmlBind
    hops:
      - id: boot-2.1-to-2.7-java11
        source:
          java:
            allowed_versions:
              - "8"
              - "11"
          spring_boot:
            allowed_version_prefixes:
              - "2.1"
          build:
            allowed_tools:
              - maven
        target:
          java: "11"
          spring_boot: "2.7.18"
          build: maven
        validation:
          build_required: true
          tests_required: true
        approval:
          required: true
      - id: boot-2.7-to-3.5-java21
        source:
          java:
            allowed_versions:
              - "11"
          spring_boot:
            allowed_version_prefixes:
              - "2.7"
          build:
            allowed_tools:
              - maven
        target:
          java: "21"
          spring_boot: "3.5.14"
          spring_framework: "6.2.18"
          build: maven
        validation:
          build_required: true
          tests_required: true
        approval:
          required: true
  - id: boot-2.1-direct-to-3.5-java21
    source:
      java:
        allowed_versions:
          - "8"
          - "11"
      spring_boot:
        allowed_version_prefixes:
          - "2.1"
      build:
        allowed_tools:
          - maven
    target:
      java: "21"
      spring_boot: "3.5.14"
      spring_framework: "6.2.18"
      build: maven
    strategy: direct_sandbox
    risk_level: high
    production_allowed: false
    recommended_intermediate:
      spring_boot: "2.7.18"
requirements:
  human_approval_required: true
  baseline_tests_required: false
  dependency_graph_unavailable_fatal: false
rules:
  human_approval_required: true
  baseline_tests_required: false
  dependency_graph_unavailable_fatal: false
  openrewrite_preview_allowed: true
  openrewrite_apply_allowed: false
openrewrite:
  preview_allowed: true
  apply_allowed: false
  catalog_path: catalogs/openrewrite/springboot-3.5-java21.yaml
  post_apply_patches:
    - type: forbidden_source_patterns_allow_jakarta
    - type: quality_rules_allow_jakarta
policies:
  safety: policies/safety.yaml
  planning: policies/planning.yaml
  transformation: policies/transformation.yaml
